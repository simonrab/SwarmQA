# Autonomous QA campaign config.
# CLI flags override these values for a single run.

# Files or directories of markdown intents and JSON recorded flows.
intents = ["intents/"]

[app]
# path = "/path/to/MyApp.app"
# build_command = ""
# bundle_id = ""
launch_args = []
# prototype = looser exploration; shipped = stricter pass/fail
maturity = "shipped"
# macos drives a Mac .app. ios drives an iOS Simulator .app.
platform = "macos"
# simulator = "iPhone 17"
# One device name or UDID per concurrent worker. Used when platform = ios.
# Names must match `xcrun simctl list devices available` (iOS 26.5 has iPhone 17, not iPhone 16).
# simulators = ["iPhone 17", "iPhone 17 Pro"]

[driver]
# auto = legacy on a Mac or for platform = ios, else fake.
# fake = scripted dry run, no Accessibility permission. legacy = AppleScript (macos) or simctl/idb (ios).
kind = "auto" # auto | fake | legacy | runner

[llm]
# Model calls for exploring and judging screens. Off by default: nothing spends
# money until you set enabled = true. Needs the extra: uv tool install 'swarmqa[anthropic]'
enabled = false
# provider = "anthropic" # anthropic | openai | fake
# max_cost = 5.0       # stop model calls past this many `currency` units
# step_model = ""      # blank = the provider's default (see docs/llm.md)
# judge_model = ""

# Per-SHA builds in a clean checkout under ~/.aqa (see docs/build.md). Used by
# `aqa build --sha` and by `aqa verify` when this table is present.
# [build]
# repo = "git@github.com:owner/app.git"   # default: the repo containing app.source_dir
# project = "App.xcodeproj"               # or a subdirectory / .xcworkspace; auto-detected when unset
# scheme = "App"                          # auto-detected with `xcodebuild -list` when unset
# [build.ios]
# command = ""                            # optional: build yourself and print the .app path

[checks]
# Used by explorer.engine = "agent". Each check is on unless set to false;
# a table overrides its settings. See docs/checks.md.
# functional = true
# layout = { contrast = false }
# baseline = false   # on by default only when [visual] enabled = true
# judge = true       # model judge; needs [llm] enabled = true

[campaign]
# local = this machine; vm = Tart on Apple Silicon; cloud = metered adapter
backend = "local"
# Max concurrent sessions. Default 2. GUI sessions on one display get flaky
# above gui_worker_warn_threshold; prefer vm or cloud for larger fleets.
workers = 2
shard_strategy = "intent" # intent | suite | exploratory_seed
# max_wall_time = "2h"
# max_worker_minutes = 60
on_budget = "drain" # drain | cancel
fail_on = "scripted" # scripted | any | never
report_root = "reports"
gui_worker_warn_threshold = 2

[local]
isolation = "thread" # thread | subprocess

[vm]
provider = "tart"
# image = "ghcr.io/cirruslabs/macos-sonoma-base:latest"
tart_bin = "tart"
recycle = true
cost_per_worker_minute = 0.0

[cloud]
# v1 ships a local cost simulator. A paid Mac host plugs in behind this name.
adapter = "simulator"
cost_per_worker_minute = 0.05
estimated_shard_minutes = 1.0
# endpoint_env = "AQA_CLOUD_ENDPOINT"
# token_env = "AQA_CLOUD_TOKEN"

[spend]
# Required and must be > 0 when backend = cloud.
# Ignored on pure local (the report notes that). Enforced for vm when the
# adapter reports a non-zero cost_per_worker_minute and max_spend is set.
# Suggested cloud default: 10 USD.
# max_spend = 10.0
currency = "USD"
overrun = "drain" # drain | cancel

[video]
# always | on_failure | exploratory_only
mode = "always"

[issues]
github = false
linear = false
template = "templates/issue.md"
# github_repo = "owner/name"
github_token_env = "GH_TOKEN"
linear_api_key_env = "LINEAR_API_KEY"
# linear_team = "TEAMID"

[visual]
enabled = false
baseline_dir = "baselines"
threshold = 0.01

# Appearance judgment. Off by default. Pixel diff does not call this.
# Claude Code or Codex can be the command. It receives the PNG path and
# prints {"ok": true} or {"ok": false, "judgment": "what looks wrong"}.
[visual.judgment]
enabled = false
provider = "command" # command | fake
command_env = "AQA_VISUAL_JUDGE_COMMAND"
# command = ""  # used when AQA_VISUAL_JUDGE_COMMAND is unset
# judgment = ""  # canned text for provider = "fake"

[coverage]
scripted = true
exploratory = true
visual = false

[explorer]
# legacy = the original explorer; agent = observe-decide-act loop with [checks]
# (and a model when [llm] enabled = true). See docs/explorer-v2.md.
engine = "legacy" # legacy | agent
max_steps = 40
max_time_s = 120
on_step_failure = "stop" # stop | continue

# Decision backends for exploratory observe→decide→act.
# Default heuristic keeps CI / FakeDriver behavior identical.
# [explorer.decision]
# mode = "heuristic" # heuristic | system_one | computer_use | cascade
# escalate_after = 3
# max_model_calls = 8
# model_timeout_s = 30.0
# cache_observations = true
#
# [explorer.decision.system_one]
# provider = "http" # http | fake
# endpoint_env = "AQA_SYSTEM_ONE_ENDPOINT"
# api_key_env = "AQA_SYSTEM_ONE_API_KEY"
# min_confidence = 0.55
# include_tree_depth = 4
#
# [explorer.decision.computer_use]
# provider = "command" # command | fake
# command_env = "AQA_COMPUTER_USE_COMMAND"
# max_calls = 3
# include_a11y_hint = true

# UX friction metering (advisory friction_path findings).
# fail_ci is reserved and not wired to fail_on yet.
[explorer.friction]
enabled = true
emit_threshold = 50
min_extra_steps = 3
min_backtrack_rate = 0.15
personas = ["expert", "first_time"]
fail_ci = false
compare_to = "gold" # gold | prior_p50
klm = true
# Optional per-intent ceilings (inclusive). Hunts at or below the ratio stay quiet.
# Shard tags may override: allow_step_ratio:3.5
# [explorer.friction.allow_step_ratio]
# "export-wizard" = 3.5

[suite]
# command = "xcodebuild test -scheme MyApp"
