name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - uses: astral-sh/setup-uv@v6
      - name: Tool install
        run: |
          uv tool install .
          aqa="$(uv tool dir --bin)/aqa"
          "$aqa" --version
          "$aqa" init --dir "$RUNNER_TEMP/aqa-init"
          test -f "$RUNNER_TEMP/aqa-init/aqa.config.toml"
